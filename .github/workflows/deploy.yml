# ワークフロー名
name: VPS Deploy

# トリガーの設定
# 例はmainブランチにpushしたとき
on:
  push:
    branches: [main]

# 環境変数の指定
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: py

# ジョブ内容の指定
jobs:
  deploy:
    runs-on: ubuntu-latest
    # イメージをプッシュする権限をGITHUB_TOKENに付与する
    permissions:
      contents: read
      packages: write

    steps:
    # ランナーのチェックアウト（ファイルをubuntuにコピーする）
      - name: Checkout repository
        uses: actions/checkout@v5
      
      # ghcrにログインする
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # PATを指定する
          password: ${{ secrets.GHCR_TOKEN }}

        # コンテナイメージをビルド・pushする
      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
         context: ./frontend
         push: true
         tags: ghcr.io/aya-udg/pomodoro-frontend:${{ github.ref_name }} 

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
         context: ./backend
         push: true
         tags: ghcr.io/aya-udg/pomodoro-backend:${{ github.ref_name }} 

      # SSH接続をする
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/kohakucd/github-deploy/Pomodoro_Timer
            git pull origin main
            docker compose -f compose.yml pull
            docker compose -f compose.yml up -d
