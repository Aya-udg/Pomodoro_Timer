services:
    frontend:
      build: 
        context: ./frontend
        dockerfile: dockerfile.dev
      container_name: frontend
      restart: always
      ports:
        - 3000:3000
      env_file:
      - .env
    backend:
      build: 
        context: ./backend
        dockerfile: dockerfile.dev
      container_name: backend
      restart: always
      ports:
        - 8000:8000
      env_file:
      - .env
    db:
      image: postgres:17
      container_name: Portfolio
      restart: always
      env_file:
        - .env
      ports:
        - "${POSTGRES_PORT}:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: